services:
  wordpress:
    image: php:8.3-apache
    cpus: 0.25
    mem_limit: 499m
    volumes:
      - .:/var/www/html
      - .stack-data/uploads:/var/www/html/uploads
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)empty(@file_get_contents(\"http://127.0.0.1/\")));'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mariadb:
    image: mariadb:11
    cpus: 0.25
    mem_limit: 499m
    volumes:
      - .stack-data/mariadb3:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
