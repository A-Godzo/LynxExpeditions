services:
  frontend:
    image: node:22
    command: ["node", "server.js"]
    cpus: 0.5
    mem_limit: 512m
    volumes:
      - .stack-data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: python:3.12
    command: ["python", "api.py"]
    cpus: 0.25
    mem_limit: 256m