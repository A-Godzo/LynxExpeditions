services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.web
    cpus: 0.25
    mem_limit: 499m
    environment:
      MYSQL_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - .:/var/www/html
      - .stack-data/uploads:/var/www/html/uploads
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)empty(@file_get_contents(\"http://127.0.0.1/\")));'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mariadb:
    image: mariadb:11
    cpus: 0.25
    mem_limit: 499m
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - .stack-data/mariadb5:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
