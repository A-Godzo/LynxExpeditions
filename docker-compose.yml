services:
  wordpress:
    image: wordpress:6.7-apache
    cpus: 0.5
    mem_limit: 512m
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      
.stack-data/wordpress:/var/www/html
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost/"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 30s
