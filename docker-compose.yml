services:
  wordpress:
    image: wordpress:6.7-apache
    cpus: 0.25
    mem_limit: 512m
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - .stack-data/wordpress:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mariadb:
    image: mariadb:11
    cpus: 0.25
    mem_limit: 512m
    volumes:
      - .stack-data/mariadb:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
